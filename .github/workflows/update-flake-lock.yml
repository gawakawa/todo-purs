name: "Update Flake Lock"

on:
  workflow_dispatch: # Allow manual trigger
  schedule:
    - cron: "0 15 * * 5" # Run every Saturday at 00:00 JST (Friday 15:00 UTC)

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    strategy:
      matrix:
        include:
          - { dir: ".", label: "root" }
          - { dir: "frontend", label: "frontend" }
          - { dir: "backend", label: "backend" }
    uses: gawakawa/.github/.github/workflows/update-flake-lock.yml@main
    with:
      auto-merge: true
      path-to-flake-dir: ${{ matrix.dir }}
      pr-title: "⬆️ Update flake.lock (${{ matrix.label }})"
      branch: "update-flake-lock-${{ matrix.label }}"
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
